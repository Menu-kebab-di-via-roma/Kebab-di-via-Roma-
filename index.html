<script>
const state = {
  orderType: 'asporto',
  cart: {},
  lang: 'it'
};

// Background Music Control
const audio = document.getElementById('bg-audio');
audio.volume = 0.3; // دھیمی آواز (30%)

let isMusicPlaying = false;

function toggleBackgroundMusic() {
  const btn = document.getElementById('music-toggle-btn');
  if (audio.paused) {
    audio.play().then(() => {
      isMusicPlaying = true;
      btn.innerText = "🎵 Music: ON";
      btn.style.background = "linear-gradient(135deg, #27ae60, #2ecc71)";
    }).catch(e => {
      console.log("Play failed:", e);
    });
  } else {
    audio.pause();
    isMusicPlaying = false;
    btn.innerText = "🔇 Music: OFF";
    btn.style.background = "linear-gradient(135deg, #c0392b, #e74c3c)";
  }
}

// بروزر کیپٹن پالیسی کو بائی پاس کرنے کے لیے: جیسے ہی یوزر اسکرین پر کہیں بھی کلک یا ٹچ کرے گا، میوزک چل پڑے گا
document.addEventListener('click', function initAudioPlay() {
  if (!isMusicPlaying && audio.paused) {
    audio.play().then(() => {
      isMusicPlaying = true;
      const btn = document.getElementById('music-toggle-btn');
      if(btn) {
        btn.innerText = "🎵 Music: ON";
        btn.style.background = "linear-gradient(135deg, #27ae60, #2ecc71)";
      }
    }).catch(err => {
      console.log("Interaction play blocked:", err);
    });
  }
}, { once: true }); // یہ صرف پہلی کلک پر چلے گا
